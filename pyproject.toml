[project]
name = "healthy_food_nutrition_management_system"
version = "0.1.0"
description = "healthy_food_nutrition_management_system using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.6.1"
]

[project.scripts]
healthy_food_nutrition_management_system = "healthy_food_nutrition_management_system.main:run"
run_crew = "healthy_food_nutrition_management_system.main:run"
train = "healthy_food_nutrition_management_system.main:train"
replay = "healthy_food_nutrition_management_system.main:replay"
test = "healthy_food_nutrition_management_system.main:test"
run_with_trigger = "healthy_food_nutrition_management_system.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.hatch.build.targets.wheel]
packages = ["src/healthy_food_nutrition_management_system"]

[tool.hatch.metadata]
src-layout = true

